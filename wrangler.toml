name = "balado"
main = "worker.js"
compatibility_date = "2026-10-29"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = [
    "/api/*",
    "/health",
    "/clan",
    "/currentwar",
    "/raid",
    "/activity",
    "/cwl",
    "/cwl/groups"
]
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "balado-archive"
database_id = "842151d8-a6c8-414a-a650-40ffbe5ce619"
