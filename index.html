<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clan statistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&family=Fruktur&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="pages/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased">
    <main class="w-full max-w-5xl mx-auto px-4 pt-4 pb-28 flex-1">
        <header id="clanHeader" class="w-full pt-3"></header>
        <section id="section-about" class="w-full"></section>
        <section id="section-members" class="w-full hidden-section"></section>
        <section id="section-battle" class="w-full hidden-section py-3 pb-28 text-gray-300 text-sm">
            <div class="relative grid grid-cols-2 gap-1 p-1 mb-3 rounded-xl bg-[#141414] border border-[#2A2A2A]">
                <span id="battlePill" class="absolute top-1 bottom-1 left-1 rounded-lg bg-[#2A2410] border border-[#6B5A1E]"
                      style="width:calc((100% - 0.75rem) / 2); transition:transform 220ms cubic-bezier(.4,0,.2,1)"></span>
                <button id="tab-battle-war" type="button" class="relative z-10 py-1.5 rounded-lg text-[9px] font-semibold tracking-wide uppercase active:scale-95 transition-all">War</button>
                <button id="tab-battle-cwl" type="button" class="relative z-10 py-1.5 rounded-lg text-[9px] font-semibold tracking-wide uppercase active:scale-95 transition-all">CWL</button>
            </div>
            <div id="section-war" class="w-full"></div>
            <div id="section-cwl" class="w-full hidden"></div>
        </section>
        <section id="section-raid" class="w-full hidden-section"></section>
        <section id="section-settings" class="w-full hidden-section"></section>
    </main>
    <nav id="bottomToolbar" aria-label="Main Navigation">
        <button id="tab-about" class="active">
            <span class="material-symbols-outlined nav-icon">home</span><span class="nav-label">Home</span>
        </button>
        <button id="tab-members">
            <span class="material-symbols-outlined nav-icon">groups</span><span class="nav-label">Member</span>
        </button>
        <button id="tab-battle">
            <span class="material-symbols-outlined nav-icon">swords</span><span class="nav-label">Battle</span>
        </button>
        <button id="tab-raid">
            <span class="material-symbols-outlined nav-icon">savings</span><span class="nav-label">Raid</span>
        </button>
    </nav>
    <script type="module" src="js/app.js"></script>
</body>
</html>
